name: Frontend CI

on:
  pull_request:
  push:
    branches: ['**']
    tags: ['review-2', 'review-2-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  frontend-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run verify:api
      - run: npm run test:coverage
      - name: Keep unit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-unit-${{ github.sha }}
          path: |
            reports/
            coverage/
          retention-days: 30

  frontend-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --project=chromium
      - name: Keep browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-browser-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
            reports/
          retention-days: 30
